<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aura Finance PRO - Vídeo Narrado</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    .gold-glow {
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.25);
    }
    .gold-text {
      background: linear-gradient(135deg, #facc15 0%, #f59e0b 50%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased p-4 sm:p-6 flex flex-col items-center justify-center min-h-screen">
  <div class="max-w-4xl w-full bg-slate-900/90 border border-amber-500/30 rounded-3xl overflow-hidden shadow-2xl flex flex-col">
    <!-- Top Bar -->
    <div class="p-4 sm:p-5 border-b border-slate-800 bg-slate-950/80 flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-400 to-yellow-600 text-slate-950 flex items-center justify-center font-black text-lg shadow-md">
          ⚡
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black text-white flex items-center gap-2">
            <span>Aura Finance PRO</span>
            <span class="text-[11px] px-2 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40 uppercase font-extrabold">Vídeo Demonstração</span>
          </h1>
          <p class="text-xs text-slate-400">Apresentação Narrada com IA Multimodal, Cartões, PWA e Faturas</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="recordBtn" class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold transition-all flex items-center gap-1.5">
          <span id="recordIcon">⏺️</span>
          <span id="recordLabel">Gravar / Baixar Vídeo</span>
        </button>
      </div>
    </div>

    <!-- Video Canvas Display (16:9 aspect ratio) -->
    <div class="relative w-full aspect-video bg-black flex items-center justify-center overflow-hidden border-b border-slate-800 select-none">
      <canvas id="videoCanvas" width="1280" height="720" class="w-full h-full object-contain"></canvas>

      <!-- Overlay Play Button when Paused -->
      <div id="playOverlay" class="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center cursor-pointer transition-opacity">
        <button id="bigPlayBtn" class="w-20 h-20 rounded-full bg-gradient-to-tr from-amber-500 via-yellow-400 to-amber-300 text-slate-950 flex items-center justify-center text-3xl font-black shadow-2xl hover:scale-110 active:scale-95 transition-all">
          ▶
        </button>
        <p class="text-sm font-bold text-white mt-4 drop-shadow">Clique para Iniciar o Vídeo com Narração em Voz</p>
        <p class="text-xs text-amber-300/80 mt-1">Duração: ~60 segundos • Som de Locução Ativo</p>
      </div>

      <!-- Subtitle Ribbon at Bottom of Screen -->
      <div class="absolute bottom-4 left-6 right-6 pointer-events-none">
        <div id="subtitleBox" class="bg-black/85 backdrop-blur-md border border-amber-400/30 rounded-2xl px-5 py-2.5 text-center shadow-lg transition-all">
          <p id="subtitleText" class="text-xs sm:text-sm font-semibold text-slate-100">
            Bem-vindo ao Aura Finance PRO: a plataforma definitiva de inteligência financeira.
          </p>
        </div>
      </div>
    </div>

    <!-- Video Player Controls -->
    <div class="p-4 sm:p-5 bg-slate-950 flex flex-col gap-3">
      <!-- Timeline Scrub Bar -->
      <div class="flex items-center gap-3">
        <span id="currentTime" class="text-xs font-mono text-slate-400">00:00</span>
        <div class="flex-1 h-2.5 rounded-full bg-slate-800 relative cursor-pointer group" id="progressBarContainer">
          <div id="progressBar" class="h-full rounded-full bg-gradient-to-r from-amber-400 to-yellow-500 w-0 transition-all"></div>
        </div>
        <span id="totalTime" class="text-xs font-mono text-slate-400">01:05</span>
      </div>

      <!-- Bottom Buttons Bar -->
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div class="flex items-center gap-2">
          <button id="playPauseBtn" class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs transition-all shadow-md active:scale-95 flex items-center gap-1.5">
            <span id="playPauseIcon">▶</span>
            <span id="playPauseLabel">Iniciar</span>
          </button>

          <button id="restartBtn" class="p-2 rounded-xl bg-slate-850 hover:bg-slate-800 text-slate-300 text-xs font-semibold transition-colors" title="Reiniciar do começo">
            🔄
          </button>

          <button id="voiceToggleBtn" class="px-3 py-2 rounded-xl bg-slate-850 hover:bg-slate-800 text-slate-300 text-xs font-medium transition-colors flex items-center gap-1.5">
            <span id="voiceIcon">🔊</span>
            <span id="voiceLabel">Locução Ativa</span>
          </button>
        </div>

        <!-- Chapter Selector Pills -->
        <div class="flex items-center gap-1.5 overflow-x-auto text-[11px] font-semibold text-slate-400">
          <button class="scene-pill px-2.5 py-1 rounded-lg hover:text-amber-300 bg-slate-900 border border-slate-800" data-scene="0">1. Dashboard</button>
          <button class="scene-pill px-2.5 py-1 rounded-lg hover:text-amber-300 bg-slate-900 border border-slate-800" data-scene="1">2. PWA App</button>
          <button class="scene-pill px-2.5 py-1 rounded-lg hover:text-amber-300 bg-slate-900 border border-slate-800" data-scene="2">3. Cartões</button>
          <button class="scene-pill px-2.5 py-1 rounded-lg hover:text-amber-300 bg-slate-900 border border-slate-800" data-scene="3">4. Porquinho 45k</button>
          <button class="scene-pill px-2.5 py-1 rounded-lg hover:text-amber-300 bg-slate-900 border border-slate-800" data-scene="4">5. Compras</button>
          <button class="scene-pill px-2.5 py-1 rounded-lg hover:text-amber-300 bg-slate-900 border border-slate-800" data-scene="5">6. Assinatura</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // SCENE & SCRIPT DEFINITION
    // -------------------------------------------------------------
    const SCENES = [
      {
        id: 'intro_dashboard',
        title: 'Dashboard Executivo & Patrimônio',
        badge: 'CYBER GOLD DESIGN',
        duration: 11,
        narration: 'Conheça o Aura Finance PRO: seu ecossistema financeiro premium com design Black and Cyber Gold, controle de saldo consolidado, conciliação e cotações ao vivo do Banco Central.',
        draw: (ctx, t) => {
          drawDashboardScene(ctx, t);
        }
      },
      {
        id: 'pwa_mobile',
        title: 'Aplicativo PWA para Celular',
        badge: 'INSTALAÇÃO 1-CLIQUE',
        duration: 10,
        narration: 'Com suporte a Progressive Web App, você baixa o Aura Finance direto no celular iOS ou Android, com acesso rápido pela tela inicial, notificações e modo offline.',
        draw: (ctx, t) => {
          drawPWAScene(ctx, t);
        }
      },
      {
        id: 'credit_cards',
        title: 'Cartões de Crédito & Leitor de Fatura',
        badge: 'LEITURA PDF & OCR',
        duration: 11,
        narration: 'Controle total de cartões Nubank, Inter, BTG e XP com visual 3D holográfico, limites em tempo real e leitor inteligente de faturas em PDF para importar seus gastos com um clique.',
        draw: (ctx, t) => {
          drawCardsScene(ctx, t);
        }
      },
      {
        id: 'ai_piggy',
        title: 'IA Multimodal & Prints de Bancos',
        badge: 'PORQUINHO R$ 45.000',
        duration: 12,
        narration: 'Envie prints de porquinhos e caixinhas! Você manda o print do seu porquinho de 45 mil reais, e a inteligência artificial reconhece o valor na hora e lança direto no seu patrimônio.',
        draw: (ctx, t) => {
          drawPiggyScene(ctx, t);
        }
      },
      {
        id: 'shopping_lists',
        title: 'Listas de Compras Inteligentes',
        badge: 'MERCADO & CASA',
        duration: 10,
        narration: 'Organize listas de mercado e compras para casa com sugestões rápidas. Conforme você coloca os itens no carrinho, o app soma os valores e lança a despesa final no fluxo de caixa.',
        draw: (ctx, t) => {
          drawShoppingScene(ctx, t);
        }
      },
      {
        id: 'subscription_invoices',
        title: 'Faturas de Assinatura & Vencimento Dia 10',
        badge: 'MENSALIDADE R$ 9,90',
        duration: 11,
        narration: 'Área exclusiva de faturas do sistema por apenas 9 reais e 90 ao mês. Vencimento todo dia 10 com status em tempo real, pagamento via PIX Mercado Pago e desbloqueio instantâneo.',
        draw: (ctx, t) => {
          drawInvoicesScene(ctx, t);
        }
      }
    ];

    const TOTAL_DURATION = SCENES.reduce((acc, s) => acc + s.duration, 0);

    // -------------------------------------------------------------
    // STATE & CONTROLS
    // -------------------------------------------------------------
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    let isPlaying = false;
    let currentTime = 0;
    let voiceEnabled = true;
    let lastTimestamp = 0;
    let currentSceneIndex = 0;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    const playOverlay = document.getElementById('playOverlay');
    const bigPlayBtn = document.getElementById('bigPlayBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const playPauseLabel = document.getElementById('playPauseLabel');
    const restartBtn = document.getElementById('restartBtn');
    const voiceToggleBtn = document.getElementById('voiceToggleBtn');
    const voiceIcon = document.getElementById('voiceIcon');
    const voiceLabel = document.getElementById('voiceLabel');
    const subtitleText = document.getElementById('subtitleText');
    const progressBar = document.getElementById('progressBar');
    const progressBarContainer = document.getElementById('progressBarContainer');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const recordBtn = document.getElementById('recordBtn');
    const recordLabel = document.getElementById('recordLabel');

    totalTimeEl.textContent = formatTime(TOTAL_DURATION);

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // -------------------------------------------------------------
    // SPEECH SYNTHESIS ENGINE (LOCUÇÃO EM PORTUGUÊS)
    // -------------------------------------------------------------
    let currentUtterance = null;

    function speakSceneNarration(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'pt-BR';
      utter.rate = 1.05;
      utter.pitch = 1.0;

      // Select natural Portuguese voice if available
      const voices = window.speechSynthesis.getVoices();
      const ptVoice = voices.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt_BR'));
      if (ptVoice) utter.voice = ptVoice;

      window.speechSynthesis.speak(utter);
      currentUtterance = utter;
    }

    function stopNarration() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    // -------------------------------------------------------------
    // RENDER LOOP
    // -------------------------------------------------------------
    function render(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += delta;
        if (currentTime >= TOTAL_DURATION) {
          currentTime = TOTAL_DURATION;
          pause();
        }
      }

      // Determine active scene
      let accumulated = 0;
      let activeIdx = 0;
      let sceneLocalTime = 0;

      for (let i = 0; i < SCENES.length; i++) {
        if (currentTime >= accumulated && currentTime < accumulated + SCENES[i].duration) {
          activeIdx = i;
          sceneLocalTime = currentTime - accumulated;
          break;
        }
        accumulated += SCENES[i].duration;
      }

      if (currentTime >= TOTAL_DURATION) {
        activeIdx = SCENES.length - 1;
        sceneLocalTime = SCENES[activeIdx].duration;
      }

      // Check scene transition for voice
      if (activeIdx !== currentSceneIndex) {
        currentSceneIndex = activeIdx;
        if (isPlaying && voiceEnabled) {
          speakSceneNarration(SCENES[currentSceneIndex].narration);
        }
      }

      // Draw active scene
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      SCENES[activeIdx].draw(ctx, sceneLocalTime);

      // Update UI
      subtitleText.textContent = SCENES[activeIdx].narration;
      currentTimeEl.textContent = formatTime(currentTime);
      const progressPercent = (currentTime / TOTAL_DURATION) * 100;
      progressBar.style.width = `${progressPercent}%`;

      // Update scene pills highlight
      document.querySelectorAll('.scene-pill').forEach((pill, idx) => {
        if (idx === activeIdx) {
          pill.classList.add('border-amber-400', 'text-amber-300', 'bg-slate-800');
        } else {
          pill.classList.remove('border-amber-400', 'text-amber-300', 'bg-slate-800');
        }
      });

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    // -------------------------------------------------------------
    // SCENE DRAWING FUNCTIONS (HIGH-PRECISION CANVAS GRAPHICS)
    // -------------------------------------------------------------
    function drawBackground(ctx) {
      // Obsidian gradient background
      const grad = ctx.createRadialGradient(640, 360, 50, 640, 360, 700);
      grad.addColorStop(0, '#0f172a');
      grad.addColorStop(1, '#020617');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1280, 720);

      // Cyber Gold Grid Lines
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 1280; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 720);
        ctx.stroke();
      }
      for (let y = 0; y < 720; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1280, y);
        ctx.stroke();
      }
    }

    function drawHeaderBadge(ctx, title, badge) {
      // Badge
      ctx.fillStyle = 'rgba(250, 204, 21, 0.15)';
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 1.5;
      roundRect(ctx, 60, 50, 200, 32, 16);
      ctx.fill();
      ctx.stroke();

      ctx.font = 'bold 13px Inter, sans-serif';
      ctx.fillStyle = '#facc15';
      ctx.textAlign = 'center';
      ctx.fillText(badge, 160, 71);

      // Scene Title
      ctx.font = '900 36px Inter, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.fillText(title, 60, 125);
    }

    // 1. Dashboard Scene
    function drawDashboardScene(ctx, t) {
      drawBackground(ctx);
      drawHeaderBadge(ctx, 'Dashboard Executivo & Patrimônio', 'AURA FINANCE PRO');

      // Metric Card 1: Saldo Consolidado
      drawMetricCard(ctx, 60, 160, 360, 170, 'Saldo Consolidado', 'R$ 84.520,00', '+18.4% este mês', '#facc15');

      // Metric Card 2: Receitas
      drawMetricCard(ctx, 460, 160, 360, 170, 'Entradas Mensais', 'R$ 13.700,00', '12 recebimentos', '#34d399');

      // Metric Card 3: Taxa Selic BACEN
      drawMetricCard(ctx, 860, 160, 360, 170, 'Selic Meta (BACEN)', '13,75% a.a.', 'Cotação em tempo real', '#38bdf8');

      // Animated Chart Box
      ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.2)';
      ctx.lineWidth = 2;
      roundRect(ctx, 60, 360, 1160, 270, 24);
      ctx.fill();
      ctx.stroke();

      // Chart Label
      ctx.font = 'bold 16px Inter, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'left';
      ctx.fillText('EVOLUÇÃO DO FLUXO DE CAIXA MENSAL', 90, 405);

      // Draw Wave Chart
      ctx.beginPath();
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 4;
      const points = [
        { x: 90, y: 560 },
        { x: 260, y: 530 },
        { x: 440, y: 480 },
        { x: 620, y: 510 },
        { x: 800, y: 440 },
        { x: 980, y: 470 },
        { x: 1160, y: 410 },
      ];

      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        const xc = (points[i].x + points[i - 1].x) / 2;
        const yc = (points[i].y + points[i - 1].y) / 2;
        ctx.quadraticCurveTo(points[i - 1].x, points[i - 1].y, xc, yc);
      }
      ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      ctx.stroke();

      // Glowing pulsing dot at current point
      const p = points[points.length - 1];
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8 + Math.sin(t * 5) * 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // 2. PWA Scene
    function drawPWAScene(ctx, t) {
      drawBackground(ctx);
      drawHeaderBadge(ctx, 'Aplicativo PWA para Celular', 'DOWNLOAD & OFFLINE');

      // Phone Mockup (Center Left)
      const phoneX = 220;
      const phoneY = 160;
      ctx.fillStyle = '#020617';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 6;
      roundRect(ctx, phoneX, phoneY, 280, 480, 40);
      ctx.fill();
      ctx.stroke();

      // Phone screen inner
      ctx.fillStyle = '#090d16';
      roundRect(ctx, phoneX + 8, phoneY + 8, 264, 464, 32);
      ctx.fill();

      // Top Notch
      ctx.fillStyle = '#1e293b';
      roundRect(ctx, phoneX + 90, phoneY + 16, 100, 18, 9);
      ctx.fill();

      // PWA App Icon inside Phone
      ctx.fillStyle = 'rgba(250, 204, 21, 0.15)';
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 2;
      roundRect(ctx, phoneX + 42, phoneY + 140, 180, 180, 36);
      ctx.fill();
      ctx.stroke();

      ctx.font = '70px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚡', phoneX + 132, phoneY + 250);

      ctx.font = 'bold 15px Inter, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Aura Finance PRO', phoneX + 132, phoneY + 360);

      // Right Explanation Cards
      drawFeatureCard(ctx, 560, 180, 620, 120, '📱 Instalação Nativa Sem Lojas', 'Instale com 1 clique diretamente no navegador do iOS ou Android.');
      drawFeatureCard(ctx, 560, 330, 620, 120, '⚡ Ícone na Tela Inicial', 'Abre em modo standalone de tela cheia como um app nativo.');
      drawFeatureCard(ctx, 560, 480, 620, 120, '🔄 Acesso Rápido & Offline', 'Carregamento instantâneo de saldos com Service Worker.');
    }

    // 3. Credit Cards Scene
    function drawCardsScene(ctx, t) {
      drawBackground(ctx);
      drawHeaderBadge(ctx, 'Controle de Cartões & Leitura de Fatura', 'LEITOR OCR POR IA');

      // 3D Glass Credit Card
      const cardX = 100;
      const cardY = 190;
      const cardW = 460;
      const cardH = 270;

      const gradCard = ctx.createLinearGradient(cardX, cardY, cardX + cardW, cardY + cardH);
      gradCard.addColorStop(0, '#2e1065');
      gradCard.addColorStop(0.5, '#0f172a');
      gradCard.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = gradCard;
      ctx.strokeStyle = 'rgba(168, 85, 247, 0.6)';
      ctx.lineWidth = 3;
      roundRect(ctx, cardX, cardY, cardW, cardH, 28);
      ctx.fill();
      ctx.stroke();

      // Chip
      ctx.fillStyle = '#fbbf24';
      roundRect(ctx, cardX + 50, cardY + 70, 55, 42, 8);
      ctx.fill();

      // Card Bank & Number
      ctx.font = '900 18px Inter, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.fillText('NUBANK ULTRAVIOLETA', cardX + 50, cardY + 45);

      ctx.font = 'bold 22px Courier New, monospace';
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText('•••• •••• •••• 4892', cardX + 50, cardY + 160);

      ctx.font = '14px Inter, sans-serif';
      ctx.fillStyle = '#a855f7';
      ctx.fillText('LIMITE: R$ 25.000,00', cardX + 50, cardY + 220);

      // Card Invoice Scanner Box on the Right
      ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 2;
      roundRect(ctx, 620, 190, 560, 420, 24);
      ctx.fill();
      ctx.stroke();

      ctx.font = 'bold 18px Inter, sans-serif';
      ctx.fillStyle = '#facc15';
      ctx.fillText('📄 ITENS RECONHECIDOS DA FATURA (PDF)', 650, 235);

      drawInvoiceItem(ctx, 650, 270, '15/10', 'Supermercado Tauste', 'R$ 342,10', 'Alimentação');
      drawInvoiceItem(ctx, 650, 340, '16/10', 'Auto Posto Ipiranga', 'R$ 180,00', 'Combustível');
      drawInvoiceItem(ctx, 650, 410, '18/10', 'Amazon Brasil (02/05)', 'R$ 189,90', 'Equipamentos');
      drawInvoiceItem(ctx, 650, 480, '20/10', 'Uber * Viagem Urbana', 'R$ 24,90', 'Transporte');

      // Import button
      ctx.fillStyle = '#facc15';
      roundRect(ctx, 650, 550, 500, 40, 12);
      ctx.fill();
      ctx.font = 'bold 14px Inter, sans-serif';
      ctx.fillStyle = '#020617';
      ctx.textAlign = 'center';
      ctx.fillText('✓ IMPORTAR 4 GASTOS NO CARTÃO (R$ 736,90)', 900, 575);
    }

    // 4. Piggy Bank Scene (Porquinho R$ 45.000)
    function drawPiggyScene(ctx, t) {
      drawBackground(ctx);
      drawHeaderBadge(ctx, 'IA Multimodal: Prints de Porquinho & Caixinha', 'RECONHECIMENTO ÓPTICO');

      // Screenshot Card Mockup
      const shotX = 100;
      const shotY = 180;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 2;
      roundRect(ctx, shotX, shotY, 480, 440, 24);
      ctx.fill();
      ctx.stroke();

      // Nubank Caixinha Header inside Mockup
      ctx.fillStyle = '#7c3aed';
      roundRect(ctx, shotX + 24, shotY + 24, 432, 70, 16);
      ctx.fill();

      ctx.font = 'bold 18px Inter, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.fillText('🐷 Nu Caixinha • Reserva de Emergência', shotX + 45, shotY + 65);

      // Huge Amount Display
      ctx.font = 'bold 14px Inter, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('SALDO TOTAL GUARDADO NO PORQUINHO:', shotX + 45, shotY + 160);

      ctx.font = '900 48px Inter, sans-serif';
      ctx.fillStyle = '#facc15';
      ctx.fillText('R$ 45.000,00', shotX + 45, shotY + 230);

      ctx.font = '14px Inter, sans-serif';
      ctx.fillStyle = '#34d399';
      ctx.fillText('📈 Rendimento 100% do CDI • Liquidez Imediata', shotX + 45, shotY + 280);

      // Arrow in the middle
      ctx.font = '40px Inter, sans-serif';
      ctx.fillStyle = '#facc15';
      ctx.textAlign = 'center';
      ctx.fillText('➔', 650, 400);

      // AI Chat Response Card on the Right
      const chatX = 720;

    // Helper functions for drawing
    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // -------------------------------------------------------------
    // PLAYBACK CONTROLS
    // -------------------------------------------------------------
    function play() {
      if (currentTime >= TOTAL_DURATION) {
        currentTime = 0;
      }
      isPlaying = true;
      lastTimestamp = 0;
      playOverlay.classList.add('opacity-0', 'pointer-events-none');
      playPauseIcon.textContent = '⏸';
      playPauseLabel.textContent = 'Pausar';
      if (voiceEnabled) {
        speakSceneNarration(SCENES[currentSceneIndex].narration);
      }
    }

    function pause() {
      isPlaying = false;
      playOverlay.classList.remove('opacity-0', 'pointer-events-none');
      playPauseIcon.textContent = '▶';
      playPauseLabel.textContent = 'Continuar';
      stopNarration();
    }

    bigPlayBtn.addEventListener('click', play);
    playOverlay.addEventListener('click', play);

    playPauseBtn.addEventListener('click', () => {
      if (isPlaying) pause();
      else play();
    });

    restartBtn.addEventListener('click', () => {
      currentTime = 0;
      currentSceneIndex = 0;
      play();
    });

    voiceToggleBtn.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      if (voiceEnabled) {
        voiceIcon.textContent = '🔊';
        voiceLabel.textContent = 'Locução Ativa';
        if (isPlaying) speakSceneNarration(SCENES[currentSceneIndex].narration);
      } else {
        voiceIcon.textContent = '🔇';
        voiceLabel.textContent = 'Sem Voz';
        stopNarration();
      }
    });

    progressBarContainer.addEventListener('click', (e) => {
      const rect = progressBarContainer.getBoundingClientRect();
      const clickRatio = (e.clientX - rect.left) / rect.width;
      currentTime = clickRatio * TOTAL_DURATION;
      if (voiceEnabled && isPlaying) {
        speakSceneNarration(SCENES[currentSceneIndex].narration);
      }
    });

    document.querySelectorAll('.scene-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const sceneNum = parseInt(pill.getAttribute('data-scene'), 10);
        let acc = 0;
        for (let i = 0; i < sceneNum; i++) {
          acc += SCENES[i].duration;
        }
        currentTime = acc;
        if (!isPlaying) play();
        else if (voiceEnabled) speakSceneNarration(SCENES[sceneNum].narration);
      });
    });

    // -------------------------------------------------------------
    // VIDEO RECORDING (EXPORT TO WEBM / MP4)
    // -------------------------------------------------------------
    recordBtn.addEventListener('click', () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    function startRecording() {
      try {
        const stream = canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        recordedChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'Aura_Finance_PRO_Demonstracao.webm';
          a.click();
          isRecording = false;
          recordLabel.textContent = 'Gravar / Baixar Vídeo';
          recordBtn.classList.remove('bg-rose-600', 'text-white');
        };

        mediaRecorder.start();
        isRecording = true;
        recordLabel.textContent = 'Gravando... (Clique para Salvar)';
        recordBtn.classList.add('bg-rose-600', 'text-white');

        currentTime = 0;
        play();
      } catch (err) {
        alert('Seu navegador não suporta exportação direta de stream do Canvas. Você pode assistir o vídeo interativo diretamente aqui!');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }
